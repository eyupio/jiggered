services:
  jiggered:
    image: ghcr.io/eyupio/jiggered:${JIGGERED_TAG:-latest}
    container_name: jiggered
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # nothing in it is needed any more: see the README
    ports:
      - "127.0.0.1:8080:8080"   # put a reverse proxy with HTTPS in front
    volumes:
      - jiggered-data:/data
    mem_limit: 512m
    cpus: 2
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  jiggered-data:

