services:
  ai-context:
    build:
      context: ../..
      dockerfile: tools/ai-context/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8091:8000"
    volumes:
      - context-oauth:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 1

volumes:
  context-oauth:
